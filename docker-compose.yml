services:
  postgres:
    image: postgres:16
    container_name: asg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asg
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    container_name: asg-ai-service
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: asg-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: asg
    depends_on:
      - postgres
      - ai-service

volumes:
  postgres_data: